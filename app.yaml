name: terfac-app             
region: nyc3                 

services:
  - name: web
    github:
      repo: gkundlatsch/TerFac
      branch: main
    # build_command is optional for Python—App Platform will detect requirements.txt automatically.
    run_command: gunicorn app:app --bind 0.0.0.0:$PORT
    http_port: 8080
    instance_size_slug: basic-xxs   # 512 MB RAM / 1 vCPU
    instance_count: 1

  - name: worker
    github:
      repo: gkundlatsch/TerFac
      branch: main
    run_command: rq worker default --url $REDIS_URL
    instance_size_slug: basic-s      # 1 GB RAM / 1 vCPU
    instance_count: 1
